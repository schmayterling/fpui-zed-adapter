[package]
name = "fpui-paint-inject"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
ctor = "=0.2.9"
frida-gum = { version = "=0.17.2", features = ["auto-download", "invocation-listener"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Stage B (sprites): link ONLY the image crate, used purely to DECODE the mascot to RGBA.
# The Arc<RenderImage> handed to Zed's paint_image is hand-assembled byte-for-byte from the
# layout reversed out of the pinned binary (version-independent), NOT a linked struct. We
# never link gpui: its macOS platform registers Objective-C classes that collide with Zed's
# gpui and crash the host.
image = { version = "=0.25.10", default-features = false, features = ["png", "gif"], optional = true }
# Pure-Rust glyph rasterizer (no platform/objc) to pre-rasterize card text to BGRA bitmaps,
# which take the SAME paint_image sprite path as the mascot image.
ab_glyph = { version = "0.2", optional = true }
# Capstone: append a real `fpui` SettingsPage to the Vec `settings_data()` returns (System
# allocator -> libc::realloc), so Zed itself lays out + routes a new settings category.
libc = "0.2"

[features]
sprites = ["dep:image", "dep:ab_glyph"]

[profile.release]
debug = false
strip = false
